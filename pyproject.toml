[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-welcome"
version = "1.0.0"
description = "Offline Pokémon terminal greeting with a responsive system information panel"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "nemzchan"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
]

[project.optional-dependencies]
images = ["Pillow>=9.1"]

[project.scripts]
pokemon-welcome = "pokemon_welcome.__main__:main"

[tool.setuptools.packages.find]
include = ["pokemon_welcome*"]

[tool.setuptools.package-data]
pokemon_welcome = ["assets/*.txt", "assets/*.png", "assets/pokemon-cache/*/*.png"]
